<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>404 - Nodo Inalcanzable | JBDA</title>
    
    <link rel="icon" href="/assets/Isotipo.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/Isotipo.png">
    <meta name="theme-color" content="#050505">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        /* Animación exclusiva para el cursor del 404 */
        .terminal-blink {
            animation: blinkCursor 1s step-end infinite;
            color: var(--pink-premium);
            font-weight: 300;
        }
        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body id="error-page" style="display: flex; flex-direction: column; min-height: 100vh;">

    <div id="page-transition-overlay"></div>
    <div class="orbs-container"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="blueprint-grid"></div>
    <div class="cursor-led" id="cursor-led"></div>

    <nav id="main-nav" style="padding-top: max(calc(env(safe-area-inset-top) + 5px), 25px) !important;">
        <div class="logo-container">
            <a href="/" aria-label="Volver al inicio"><img src="/assets/JBDA.png" alt="JBDA Logo" style="height: 42px;"></a>
        </div>
        
        <div style="display: flex; align-items: center; justify-content: flex-end;">
            <a href="/" class="nav-item back-link" style="display: flex; align-items: center; text-transform: uppercase; font-weight: 700; color: var(--pink-premium); font-size: 13px; letter-spacing: 1px; text-decoration: none; transition: all 0.3s ease;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span class="desktop-text" style="font-family: 'Inter', sans-serif;">Forzar Enrutamiento</span>
            </a>
        </div>
    </nav>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; z-index: 2;">
        <div class="legal-container" style="text-align: center; max-width: 750px; margin: 0 auto; padding: 70px 40px; display: flex; flex-direction: column; align-items: center; border-radius: 24px;">
            
            <h1 class="title-serif reveal-text" style="font-size: clamp(90px, 15vw, 150px); color: var(--dark-grey); margin-bottom: 0px; line-height: 1; letter-spacing: -4px;">
                404<span class="terminal-blink">_</span>
            </h1>
            
            <h2 style="font-size: clamp(20px, 4vw, 28px); color: var(--pink-premium); margin-top: 15px; margin-bottom: 25px; font-weight: 800; font-family: 'Inter', sans-serif; letter-spacing: 2px; text-transform: uppercase; border: none; padding: 0;">
                Nodo Inalcanzable
            </h2>
            
            <p style="color: var(--soft-grey); font-size: 18px; margin-bottom: 45px; max-width: 500px; line-height: 1.7; font-weight: 300;">
                El paquete de datos se ha perdido o la ruta solicitada ya no existe en la arquitectura. En <strong>JBDA</strong> somos expertos en evitar este tipo de caídas operativas. Permítanos redirigir su tráfico a una zona segura.
            </p>
            
            <a href="/" class="btn-main magnetic-btn" aria-label="Volver al inicio">Redirigir Tráfico</a>
            
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
