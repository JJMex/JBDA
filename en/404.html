<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>404 - Network Diagnostic | JBDA</title>
    
    <link rel="icon" href="../assets/Isotipo.png" type="image/png">
    <link rel="apple-touch-icon" href="../assets/Isotipo.png">
    <meta name="theme-color" content="#050505">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        .glitch-404 { display: inline-block; cursor: crosshair; transition: color 0.3s ease; position: relative; }
        .glitch-active { animation: glitchAnim 4s infinite; }
        @keyframes glitchAnim {
            0%, 95% { transform: none; text-shadow: none; opacity: 1; }
            96% { transform: skew(-8deg) translate(-2px, 1px); text-shadow: 3px 0 var(--pink-premium); opacity: 0.8; }
            97% { transform: none; text-shadow: none; opacity: 1; }
            98% { transform: skew(8deg) translate(2px, -1px); text-shadow: -3px 0 #10b981; opacity: 0.8; }
            99%, 100% { transform: none; text-shadow: none; opacity: 1; }
        }
        .status-200 { color: #10b981 !important; animation: none !important; transform: none !important; text-shadow: 0 0 25px rgba(16, 185, 129, 0.4) !important; cursor: default; }
        
        /* FLOATING TERMINAL WINDOW */
        .terminal-window {
            background: #050505;
            width: 100%;
            max-width: 650px;
            margin: 30px auto 40px auto;
            border-radius: 12px;
            overflow: hidden;
            /* Multi-layer box shadow */
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.5), 
                0 45px 65px -15px rgba(0,0,0,0.4),
                inset 0 1px 0px rgba(255,255,255,0.15),
                inset 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: left;
        }

        /* MAC STYLE WINDOW CHROME */
        .terminal-header {
            background: #1a1a1a;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .window-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        /* TERMINAL BODY */
        .terminal-body {
            padding: 25px 30px;
            font-family: 'Courier New', Courier, monospace;
            min-height: 180px;
        }
        
        /* NEON GREEN WITH CRT GLOW */
        .terminal-line { 
            color: #00ff41; 
            text-shadow: 0 0 6px rgba(0, 255, 65, 0.4); 
            font-size: 15px; 
            margin-bottom: 10px; 
            display: block; 
            opacity: 0; 
            line-height: 1.6; 
        }
        
        /* JBDA PINK HIGHLIGHT */
        .terminal-line span.highlight { 
            color: var(--pink-premium); 
            text-shadow: 0 0 10px rgba(212, 0, 109, 0.6);
            font-weight: bold; 
        }
        
        .terminal-cursor { 
            display: inline-block; width: 8px; height: 18px; 
            background-color: var(--pink-premium); vertical-align: middle; margin-left: 6px; 
            animation: blink 1s step-end infinite; box-shadow: 0 0 10px var(--pink-premium);
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body id="error-page" style="display: flex; flex-direction: column; min-height: 100vh;">

    <div id="page-transition-overlay"></div>
    <div class="orbs-container"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="blueprint-grid"></div>
    <div class="cursor-led" id="cursor-led"></div>

    <nav id="main-nav" style="padding-top: max(calc(env(safe-area-inset-top) + 5px), 25px) !important;">
        <div class="logo-container">
            <a href="../" aria-label="Back to home"><img src="../assets/JBDA.png" alt="JBDA Logo" style="height: 42px;"></a>
        </div>
        <div style="display: flex; align-items: center; justify-content: flex-end;">
            <a href="../" class="nav-item back-link" style="display: flex; align-items: center; text-transform: uppercase; font-weight: 700; color: var(--pink-premium); font-size: 13px; letter-spacing: 1px; text-decoration: none; transition: transform 0.3s ease;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span class="desktop-text" style="font-family: 'Inter', sans-serif;">Force Routing</span>
            </a>
        </div>
    </nav>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 5%; position: relative; z-index: 2;">
        <div style="text-align: center; max-width: 800px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            
            <h1 id="glitch-404" class="title-serif glitch-404 glitch-active" style="font-size: clamp(80px, 15vw, 140px); color: var(--dark-grey); margin-bottom: 0px; line-height: 1; letter-spacing: -4px;" title="Attempt manual override">
                404
            </h1>
            
            <h2 style="font-size: clamp(16px, 3vw, 22px); color: var(--pink-premium); margin-top: 10px; margin-bottom: 10px; font-weight: 800; font-family: 'Inter', sans-serif; letter-spacing: 4px; text-transform: uppercase;">
                Routing Failure
            </h2>
            
            <div class="terminal-window">
                <div class="terminal-header">
                    <div class="window-dot dot-red"></div>
                    <div class="window-dot dot-yellow"></div>
                    <div class="window-dot dot-green"></div>
                </div>
                <div class="terminal-body" id="terminal-lines">
                    </div>
            </div>
            
            <a href="../" class="btn-main magnetic-btn" aria-label="Back to Home">Redirect Traffic to Home</a>
            
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="../js/main.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const terminalBox = document.getElementById('terminal-lines');
            const glitchText = document.getElementById('glitch-404');
            
            const path = window.location.pathname;
            const safePath = path.length > 30 ? path.substring(0, 30) + '...' : path;
            
            const lines = [
                `> executing traceroute to <span class="highlight">${safePath}</span>...`,
                `> latency exceeded. <span class="highlight">data packet lost.</span>`,
                `> <span class="highlight">error 404:</span> node unreachable in current architecture.`,
                `> requesting manual re-routing_`
            ];

            let lineIndex = 0;
            let typeInterval;
            
            function typeLine() {
                if (lineIndex < lines.length) {
                    const p = document.createElement('p');
                    p.className = 'terminal-line';
                    p.style.opacity = '1';
                    
                    if (lineIndex === lines.length - 1) {
                        p.innerHTML = `> requesting manual re-routing<span class="terminal-cursor"></span>`;
                    } else {
                        p.innerHTML = lines[lineIndex];
                    }

                    if (lineIndex > 0) {
                        const prev = terminalBox.children[lineIndex - 1];
                        if(prev.innerHTML.includes('terminal-cursor')) {
                            prev.innerHTML = prev.innerHTML.replace('<span class="terminal-cursor"></span>', '');
                        }
                    }

                    terminalBox.appendChild(p);
                    lineIndex++;
                    typeInterval = setTimeout(typeLine, lineIndex === 1 ? 900 : (lineIndex === 2 ? 1400 : 1000));
                }
            }
            
            setTimeout(typeLine, 600);

            // EASTER EGG (200 OK State)
            let fixed = false;
            glitchText.addEventListener('click', function() {
                if(fixed) return;
                fixed = true;
                clearTimeout(typeInterval); 
                
                this.classList.remove('glitch-active');
                this.classList.add('status-200');
                this.innerText = '200';
                
                const linesAdded = terminalBox.querySelectorAll('.terminal-line');
                if(linesAdded.length > 0) {
                    const last = linesAdded[linesAdded.length - 1];
                    if(last.innerHTML.includes('terminal-cursor')) {
                        last.innerHTML = last.innerHTML.replace(/<span class="terminal-cursor"><\/span>/g, '');
                    }
                }
                
                const successLine = document.createElement('p');
                successLine.className = 'terminal-line';
                successLine.style.opacity = '1';
                successLine.innerHTML = `> <span style="color:#00ff41; font-weight:bold; text-shadow: 0 0 10px #00ff41;">status 200: emergency protocol engaged.</span><br>> connection restored.<br>> redirecting traffic...<span class="terminal-cursor" style="background-color:#00ff41; box-shadow: 0 0 10px #00ff41;"></span>`;
                terminalBox.appendChild(successLine);

                setTimeout(() => {
                    const overlay = document.getElementById('page-transition-overlay');
                    if(overlay) overlay.classList.remove('hidden');
                    setTimeout(() => { window.location.href = '../'; }, 400);
                }, 1800);
            });
        });
    </script>
</body>
</html>
